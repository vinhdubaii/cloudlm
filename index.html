<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudLM – Đăng nhập</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <meta name="theme-color" content="#0b0613">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CloudLM">

  <link rel="preconnect" href="https://pxpijosyqijtsvfvrnbx.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://pxpijosyqijtsvfvrnbx.supabase.co">

  <style>
    :root {
      --bg: #0b0613;
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, .55);
      --blob-1: #8b1e6e;
      --blob-2: #5b2a9e;
      --blob-3: #2e1f5e;
      --blob-4: #c2348a;
      --blob-5: #1c1530;
    }

    @property --blob-1 { syntax: '<color>'; inherits: true; initial-value: #8b1e6e }
    @property --blob-2 { syntax: '<color>'; inherits: true; initial-value: #5b2a9e }
    @property --blob-3 { syntax: '<color>'; inherits: true; initial-value: #2e1f5e }
    @property --blob-4 { syntax: '<color>'; inherits: true; initial-value: #c2348a }
    @property --blob-5 { syntax: '<color>'; inherits: true; initial-value: #1c1530 }

    *, ::after, ::before { box-sizing: border-box; margin: 0; padding: 0 }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .aurora-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, .55) 100%);
      z-index: 5;
      pointer-events: none;
    }

    .aurora-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .75;
      will-change: transform;
      mix-blend-mode: screen;
    }

    .blob-1 { width: 65vw; height: 65vw; max-width: 880px; max-height: 880px; top: -10%; left: -10%; background: radial-gradient(circle, var(--blob-1) 0, transparent 70%); animation: drift-1 13s ease-in-out infinite }
    .blob-2 { width: 60vw; height: 60vw; max-width: 820px; max-height: 820px; top: 10%; right: -15%; background: radial-gradient(circle, var(--blob-2) 0, transparent 70%); animation: drift-2 16s ease-in-out infinite }
    .blob-3 { width: 55vw; height: 55vw; max-width: 760px; max-height: 760px; bottom: -15%; left: 15%; background: radial-gradient(circle, var(--blob-3) 0, transparent 70%); animation: drift-3 18s ease-in-out infinite }
    .blob-4 { width: 48vw; height: 48vw; max-width: 660px; max-height: 660px; bottom: -10%; right: 5%; background: radial-gradient(circle, var(--blob-4) 0, transparent 70%); opacity: .55; animation: drift-4 14.5s ease-in-out infinite }
    .blob-5 { width: 40vw; height: 40vw; max-width: 560px; max-height: 560px; top: 38%; left: 38%; background: radial-gradient(circle, var(--blob-5) 0, transparent 70%); opacity: .6; animation: drift-5 11s ease-in-out infinite }

    @keyframes drift-1 { 0%{transform:translate(0,0) scale(1) rotate(0)} 22%{transform:translate(22%,14%) scale(1.25) rotate(8deg)} 41%{transform:translate(10%,30%) scale(.95) rotate(-6deg)} 63%{transform:translate(-16%,18%) scale(1.18) rotate(10deg)} 81%{transform:translate(-8%,-10%) scale(1.05) rotate(-4deg)} 100%{transform:translate(0,0) scale(1) rotate(0)} }
    @keyframes drift-2 { 0%{transform:translate(0,0) scale(1) rotate(0)} 19%{transform:translate(-20%,16%) scale(1.2) rotate(-10deg)} 38%{transform:translate(-30%,-8%) scale(.92) rotate(6deg)} 57%{transform:translate(-12%,-24%) scale(1.22) rotate(-8deg)} 79%{transform:translate(8%,-6%) scale(1.05) rotate(5deg)} 100%{transform:translate(0,0) scale(1) rotate(0)} }
    @keyframes drift-3 { 0%{transform:translate(0,0) scale(1) rotate(0)} 24%{transform:translate(18%,-22%) scale(1.28) rotate(9deg)} 46%{transform:translate(32%,-6%) scale(.9) rotate(-7deg)} 68%{transform:translate(14%,14%) scale(1.15) rotate(11deg)} 85%{transform:translate(-10%,6%) scale(1.05) rotate(-5deg)} 100%{transform:translate(0,0) scale(1) rotate(0)} }
    @keyframes drift-4 { 0%{transform:translate(0,0) scale(1) rotate(0)} 27%{transform:translate(-22%,-18%) scale(1.22) rotate(-9deg)} 49%{transform:translate(-8%,-32%) scale(.93) rotate(7deg)} 70%{transform:translate(16%,-14%) scale(1.2) rotate(-10deg)} 88%{transform:translate(10%,8%) scale(1.04) rotate(4deg)} 100%{transform:translate(0,0) scale(1) rotate(0)} }
    @keyframes drift-5 { 0%{transform:translate(-50%,-50%) scale(1) rotate(0)} 21%{transform:translate(-65%,-30%) scale(1.3) rotate(12deg)} 44%{transform:translate(-35%,-62%) scale(.88) rotate(-9deg)} 66%{transform:translate(-60%,-65%) scale(1.2) rotate(8deg)} 85%{transform:translate(-42%,-38%) scale(1.06) rotate(-6deg)} 100%{transform:translate(-50%,-50%) scale(1) rotate(0)} }

    @media (prefers-reduced-motion: reduce) {
      .aurora-blob { animation: none !important }
    }

    .login-wrap {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
    }

    .login-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 8px;
    }

    .login-sub {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 40px;
      max-width: 360px;
    }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      color: #1f1f1f;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .3);
    }

    .google-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(0, 0, 0, .4) }
    .google-btn:active { transform: translateY(0) }
    .google-btn:disabled { opacity: .6; cursor: default; transform: none }

    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0 }

    .login-status {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-dim);
      min-height: 18px;
    }

    .login-status.error { color: #f28b8b }
  </style>
</head>

<body>
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>
    <div class="aurora-blob blob-4"></div>
    <div class="aurora-blob blob-5"></div>
  </div>

  <div class="login-wrap">
    <img class="login-logo" src="/favicon.png" alt="CloudLM">
    <h1 class="login-title">CloudLM</h1>
    <p class="login-sub">The community music for everyone. Đăng nhập bằng Google để bắt đầu nghe nhạc.</p>

    <button class="google-btn" id="googleBtn" type="button">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.54 5.54 0 0 1-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.88-3c-1.08.72-2.45 1.15-4.05 1.15-3.11 0-5.75-2.1-6.69-4.92H1.3v3.09A11.998 11.998 0 0 0 12 24z"/>
        <path fill="#FBBC05" d="M5.31 14.32A7.2 7.2 0 0 1 4.93 12c0-.8.14-1.58.38-2.32V6.59H1.3A12 12 0 0 0 0 12c0 1.94.46 3.77 1.3 5.41l4.01-3.09z"/>
        <path fill="#EA4335" d="M12 4.75c1.76 0 3.35.6 4.6 1.79l3.44-3.44C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.69 1.3 6.59l4.01 3.09C6.25 6.85 8.89 4.75 12 4.75z"/>
      </svg>
      Đăng nhập với Google
    </button>

    <p class="login-status" id="loginStatus"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { supabaseClient, signInWithGoogle, DISCOVER_PATH } from "/js/auth.js";

    const googleBtn = document.getElementById("googleBtn");
    const statusEl = document.getElementById("loginStatus");

    function setStatus(msg, isError) {
      statusEl.textContent = msg || "";
      statusEl.classList.toggle("error", !!isError);
    }

    // Neu da co session hop le roi thi khong can dang nhap lai, chuyen thang.
    supabaseClient.auth.getSession().then(({ data, error }) => {
      if (error) return;
      if (data.session) {
        window.location.replace(DISCOVER_PATH);
      }
    });

    googleBtn.addEventListener("click", async () => {
      googleBtn.disabled = true;
      setStatus("Đang chuyển tới Google…");

      const { error } = await signInWithGoogle();

      if (error) {
        setStatus("Đăng nhập thất bại: " + error.message, true);
        googleBtn.disabled = false;
      }
      // Thanh cong thi trinh duyet se tu redirect sang Google roi quay ve
      // DISCOVER_PATH, khong can lam gi them o day.
    });
  </script>
</body>

</html>
